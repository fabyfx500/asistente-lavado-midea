<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Lavado - Midea</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: var(--primary);
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #fff;
      margin-bottom: 20px;
      outline: none;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 2px;
    }
    .tips {
      margin-top: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .tips ul {
      margin: 8px 0 0 0;
      padding-left: 20px;
    }
    .warning {
      background-color: #fffbebfb;
      border-left: 4px solid #f59e0b;
      padding: 10px;
      margin-top: 12px;
      font-size: 0.85rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🧺 Lavadora Midea</h1>
  <p class="subtitle">Guía rápida de lavado y secado</p>

  <label for="loadSelect">¿Qué vas a lavar hoy?</label>
  <select id="loadSelect" onchange="updateGuide()">
    <option value="deportiva">Ropa Deportiva (Poliéster)</option>
    <option value="mixto">Ropa Variada / Todo tipo (Mixto)</option>
    <option value="sabanas">Sábanas solas (con Secado)</option>
    <option value="toallas">Toallas de baño y Paños de cocina</option>
    <option value="polerones">Polerones gruesos / Pijamas</option>
    <option value="sabanas_toallas">Sábanas y Toallas juntas</option>
  </select>

  <div class="card" id="resultCard">
    <!-- El contenido se genera dinámicamente -->
  </div>
</div>

<script>
  const data = {
    deportiva: {
      programa: "20°C",
      temp: "20°C / Frío",
      centrifugado: "800 - 1000 RPM",
      secado: "APAGADO",
      tips: [
        "Usa detergente OMO líquido en la casilla II.",
        "<b>No usar suavizante:</b> Tapona los poros de las telas sintéticas.",
        "Lavar poleras con estampados al revés y cerrar cierres/velcros."
      ],
      warning: "El calor del secado o agua caliente daña permanentemente la elasticidad del poliéster."
    },
    mixto: {
      programa: "Mixto",
      temp: "20°C",
      centrifugado: "1000 RPM",
      secado: "APAGADO (o d-2 si requiere secado)",
      tips: [
        "El agua a 20°C evita que la ropa desteña o se achique.",
        "Ideal para cargas cotidianas con mezcla de telas y colores."
      ]
    },
    sabanas: {
      programa: "Algodón o Lavado/Secado",
      temp: "40°C",
      centrifugado: "1400 RPM",
      secado: "d-1 o d-2 (Auto Secado)",
      tips: [
        "Meter las piezas sueltas para evitar que se hagan una pelota.",
        "Al ser telas livianas, el sensor acortará el tiempo de secado."
      ]
    },
    toallas: {
      programa: "Algodón",
      temp: "40°C",
      centrifugado: "1200 - 1400 RPM",
      secado: "d-3 (si se requiere secado)",
      tips: [
        "Usar dosis justa de detergente (el exceso las pone duras).",
        "Evitar suavizante para que no pierdan capacidad de absorción."
      ]
    },
    polerones: {
      programa: "Algodón o Mixto",
      temp: "20°C - 30°C",
      centrifugado: "1000 - 1200 RPM",
      secado: "APAGADO (o d-2)",
      tips: [
        "Si el tambor está muy lleno, asegúrate de dejar espacio superior para que gire bien.",
        "Las temperaturas bajas evitan que el algodón se achique."
      ],
      warning: "Si el tambor vibra mucho al centrifugar, reacomoda los polerones para balancear el peso."
    },
    sabanas_toallas: {
      programa: "Algodón",
      temp: "40°C",
      centrifugado: "1400 RPM",
      secado: "d-2 o d-3",
      tips: [
        "Lava e higieniza profundamente telas pesadas.",
        "Remueve la ropa apenas termine el ciclo para evitar condensación y arrugas."
      ]
    }
  };

  function updateGuide() {
    const key = document.getElementById("loadSelect").value;
    const info = data[key];

    let html = `
      <div class="grid">
        <div class="stat-box">
          <div class="stat-label">Programa</div>
          <div class="stat-value">${info.programa}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Temperatura</div>
          <div class="stat-value">${info.temp}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Centrifugado</div>
          <div class="stat-value">${info.centrifugado}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Secado</div>
          <div class="stat-value">${info.secado}</div>
        </div>
      </div>
      <div class="tips">
        <strong>Recomendaciones:</strong>
        <ul>
          ${info.tips.map(tip => `<li>${tip}</li>`).join('')}
        </ul>
      </div>
    `;

    if (info.warning) {
      html += `<div class="warning">⚠️ ${info.warning}</div>`;
    }

    document.getElementById("resultCard").innerHTML = html;
  }

  // Inicializar al cargar
  updateGuide();
</script>

</body>
</html>
